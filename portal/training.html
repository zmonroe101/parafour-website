<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intro Training — Parafour Customer Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='20' fill='%232E7D32'/><text x='20' y='28' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-size='22' font-weight='800'>4</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="portal-page" style="visibility:hidden">

  <!-- ── Portal Topbar ── -->
  <header class="portal-topbar">
    <div class="portal-topbar-inner">
      <a href="/portal/" class="portal-logo">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="20" fill="#2E7D32"/>
          <text x="20" y="28" text-anchor="middle" fill="white" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="800">4</text>
        </svg>
        Parafour <span class="portal-logo-label">/ Portal</span>
      </a>
      <nav id="portalNav" aria-label="Portal navigation"></nav>
      <div class="portal-topbar-user">
        <span id="portalUserName"></span>
        <span id="portalTierBadge" class="tier-badge"></span>
        <button class="portal-signout" onclick="signOut()">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- ── Content ── -->
  <div class="portal-content">

    <div class="portal-welcome">
      <h1>P4 Series Intro Training</h1>
      <p>Five short modules that turn a new owner into a confident operator — finish all five to earn your Certificate of Completion.</p>
    </div>

    <div class="portal-alert" id="trainingAlert"></div>

    <!-- ── Progress ── -->
    <div class="portal-section">
      <div class="training-progress-card">
        <div class="training-progress-label">
          <strong><span id="trainingDone">0</span> of 5 modules completed</strong>
          <span>Pass each quiz with 80% or better</span>
        </div>
        <div class="training-progress-track">
          <div class="training-progress-fill" id="trainingProgressFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- ── Modules ── -->
    <div class="portal-section">
      <div class="portal-section-header">
        <h2>Modules</h2>
      </div>
      <div class="training-module-list" id="moduleList">
        <!-- rendered by training.js -->
      </div>
    </div>

    <!-- ── Certificate ── -->
    <div class="portal-section">
      <div class="portal-section-header">
        <h2>Your Certificate</h2>
      </div>
      <div class="portal-doc-card training-cert-card" id="certificateCard" style="cursor:default;">
        <!-- rendered by training.js -->
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/portal.js"></script>
  <script src="/js/billing.js"></script>
  <script src="/js/access.js"></script>
  <script src="/js/training-content.js"></script>
  <script src="/js/training.js"></script>
  <script>
    (async () => {
      // Any authenticated role — intro training is included with the
      // Free plan (hasAccess() kept for consistency and future paid
      // training tiers).
      const portalUser = await requireTier('tier1');
      if (!portalUser) return;
      if (!hasAccess(portalUser, 'intro_training')) {
        showUpgradePrompt('intro_training');
        return;
      }
      document.body.style.visibility = 'visible';
      await populatePortalNav();
      // Called directly — NOT via DOMContentLoaded (already fired after
      // the awaits above).
      await initTrainingList(portalUser);
      await logActivity('training_list_view');
    })();
  </script>

</body>
</html>
