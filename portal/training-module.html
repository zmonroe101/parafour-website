<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Module — Parafour Customer Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='20' fill='%232E7D32'/><text x='20' y='28' text-anchor='middle' fill='white' font-family='Inter,sans-serif' font-size='22' font-weight='800'>4</text></svg>" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="portal-page" style="visibility:hidden">

  <!-- ── Portal Topbar ── -->
  <header class="portal-topbar">
    <div class="portal-topbar-inner">
      <a href="/portal/" class="portal-logo">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="20" cy="20" r="20" fill="#2E7D32"/>
          <text x="20" y="28" text-anchor="middle" fill="white" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="800">4</text>
        </svg>
        Parafour <span class="portal-logo-label">/ Portal</span>
      </a>
      <nav id="portalNav" aria-label="Portal navigation"></nav>
      <div class="portal-topbar-user">
        <span id="portalUserName"></span>
        <span id="portalTierBadge" class="tier-badge"></span>
        <button class="portal-signout" onclick="signOut()">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- ── Content ── -->
  <div class="portal-content training-module-page">

    <div class="portal-welcome">
      <p class="training-breadcrumb"><a href="/portal/training.html">← Intro Training</a> · <span id="moduleNum"></span></p>
      <h1 id="moduleTitle">Loading…</h1>
    </div>

    <div class="portal-alert" id="moduleCompletedBanner"></div>

    <!-- ── Lesson ── -->
    <div class="portal-section">
      <div class="training-lesson" id="moduleBody">
        <!-- rendered by training.js from training-content.js -->
      </div>
    </div>

    <!-- ── Quiz ── -->
    <div class="portal-section">
      <div class="training-lesson" id="quizWrap">
        <!-- rendered by training.js -->
      </div>
    </div>

    <div class="training-module-nav" id="moduleNav"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/portal.js"></script>
  <script src="/js/billing.js"></script>
  <script src="/js/access.js"></script>
  <script src="/js/training-content.js"></script>
  <script src="/js/training.js"></script>
  <script>
    (async () => {
      const portalUser = await requireTier('tier1');
      if (!portalUser) return;
      if (!hasAccess(portalUser, 'intro_training')) {
        showUpgradePrompt('intro_training');
        return;
      }
      document.body.style.visibility = 'visible';
      await populatePortalNav();
      // Called directly — NOT via DOMContentLoaded (already fired after
      // the awaits above).
      await initTrainingModulePage(portalUser);
    })();
  </script>

</body>
</html>
